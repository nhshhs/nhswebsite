<!DOCTYPE html>
<!--website created by Navaneet Kadaba in 2019-->
<html>

<head>
	<link rel="shortcut icon" href="/img/icon_nhs.png">
	<!--Import Google Icon Font-->
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<!--Import materialize.css-->
	<link type="text/css" rel="stylesheet" href="/css/materialize.min.css" media="screen,projection" />
	<link type="text/css" rel="stylesheet" href="/css/style.css" media="screen,projection" />

	<!--Let browser know website is optimized for mobile-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta charset="utf-8">
	<title>HHS NHS</title>
</head>

<body id="homepage">

	<!--	more info about this in navbar.js-->
	<div id="sohiljoke3"></div>

	<!-- Navbar Component Container -->
	<div id="navbar-container"></div>
	<div class="valign-wrapper" style="height: 75vh">
		<div class="container center-align">
			<img src="/img/icon_nhs_white.png" alt="NHS Logo" id="homepagelogo"/>
			<h3 id="maintext" class="center-align white-text text-darken-4"><b>Homestead NHS</b></h3>
			
			<a class="homepage-btn homepage-btn--primary" role="button" href="/events/index.html">Check Out Events</a>

			<!-- this button is set in homepage-auth.js-->
			<a class="homepage-btn homepage-btn--outline" role="button"></a>
		</div>
		<!--	background image is in style.css-->

	</div>

	<!-- Exec-only: change homepage background -->
	<button type="button" id="bg-change-btn" class="bg-change-btn hide" title="Change background image" aria-label="Change background image">
		<i class="material-icons">image</i>
	</button>
	<input type="file" id="bg-change-input" accept="image/*" hidden>

	<!-- Preloader and it's background. -->
	<div class="preloader-background">
		<div class="preloader-wrapper big active">
			<div class="spinner-layer spinner-blue">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-red">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-yellow">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-green">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
		</div>
		<p id="loadingtext">Loading...</p>
	</div>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

	<!-- The core Firebase JS SDK is always required and must be listed first -->
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-app.js"></script>

	<!-- TODO: Add SDKs for Firebase products that you want to use
     https://firebase.google.com/docs/web/setup#available-libraries -->
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-analytics.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-auth.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-firestore.js"></script>
	<script type="text/javascript" src="/js/firebaseStuff.js"></script>
	<script type="text/javascript" src="/js/homepage-auth.js"></script>
	<script type="text/javascript" src="/js/homepage-background.js"></script>
	<script type="text/javascript" src="/js/materialize.min.js"></script>
	<script type="text/javascript" src="/js/preloader.js"></script>
	<script type="text/javascript" src="/js/navbar-component.js"></script>
	<script type="text/javascript" src="/js/navbar.js"></script>
</body>

</html>
