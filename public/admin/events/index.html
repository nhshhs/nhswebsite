<!DOCTYPE html>
<html>

<head>
	<link rel="shortcut icon" href="/img/icon_nhs.png">
	<!--Import Google Icon Font-->
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<!--Import materialize.css-->
	<link type="text/css" rel="stylesheet" href="/css/materialize.min.css" media="screen,projection" />
	<link type="text/css" rel="stylesheet" href="/css/style.css" media="screen,projection" />

	<!--Let browser know website is optimized for mobile-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta charset="utf-8">
	<title>HHS NHS | Admin Events</title>
</head>

<body>
		<!-- Navbar Component Container -->
	<div id="navbar-container"></div>
		
	<div class="container">
		<div class="row">
			<div class="col s12">
				<h3 class="center"><b class="blue-text text-darken-4">Manage Events</b></h3>
			</div>
		</div>
		<div class="row" id="messagearea">
			<div class="col s12" id="eventCol"></div>
		</div>
	</div>

	<div id="areyousuredeleteevent" class="modal">
		<div class="modal-content">
			<h4 class="red-text center">Are you sure?</h4>
			<p class="center">Are you sure you want to delete <b id="deleteEventName"></b>? This cannot be undone.</p>
		</div>
		<div class="modal-footer">
			<a href="#!" class="modal-close waves-effect waves-blue btn-flat red-text">Cancel</a>
			<a href="#!" onclick="confirmDeleteListEvent(); return false;"
				class="modal-close waves-effect waves-blue btn-flat blue-text text-darken-4">Delete</a>
		</div>
	</div>

	<!-- Preloader and it's background. -->
	<div class="preloader-background">
		<div class="preloader-wrapper big active">
			<div class="spinner-layer spinner-blue">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-red">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-yellow">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-green">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
		</div>
		<p>Loading</p>
	</div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<!-- Firebase -->
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-analytics.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-auth.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-firestore.js"></script>

	<!-- Linkify -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/linkifyjs/4.1.1/linkify.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/linkifyjs/4.1.1/linkify-string.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/linkifyjs/4.1.1/linkify-jquery.min.js"></script>

	<!-- Custom scripts -->
	<script type="text/javascript" src="/js/firebaseStuff.js"></script>
	<script type="text/javascript" src="/js/materialize.min.js"></script>
	<script type="text/javascript" src="/js/preloader.js"></script>	<script type="text/javascript" src="/js/navbar-component.js"></script>
	<script type="text/javascript" src="/js/navbar.js"></script>
	<script type="text/javascript" src="/admin/checkPermission.js"></script>
	<script type="text/javascript" src="/admin/events/events.js"></script>

</body>

</html>
