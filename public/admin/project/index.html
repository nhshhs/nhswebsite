<!DOCTYPE html>
<html>

<head>
	<link rel="shortcut icon" href="/img/icon_nhs.png">
	<!--Import Google Icon Font-->
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<!--Import materialize.css-->
	<link type="text/css" rel="stylesheet" href="/css/materialize.min.css" media="screen,projection" />
	<link type="text/css" rel="stylesheet" href="/css/style.css" media="screen,projection" />
	<!-- Quill Editor -->
	<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

	<!--Let browser know website is optimized for mobile-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta charset="utf-8">
	<title>HHS NHS | Admin Project</title>
</head>

<body>
		<!-- Navbar Component Container -->
	<div id="navbar-container"></div>
			
	<div class="center-align">
		<div class="row">
			<h3 class="blue-text text-darken-4"><b>Admin Project</b></h3>
		</div>
		<div class="row">
			<div> <a href="#createevent"
					class="waves-effect waves-light btn-large modal-trigger blue darken-4">Create
					new event</a> </div>
		</div>
		<div class="row">
			<div> <a href="/admin/project/events.html"
					class="waves-effect waves-light btn-large blue darken-4">Manage Events</a>
			</div>
		</div>
		<div class="row">
			<div> <a href="/admin/project/blog.html"
					class="waves-effect waves-light btn-large blue darken-4">Manage Blog<i
						id="pending" class="material-icons right"></i></a></div>
		</div>
	</div>
	<div id="createevent" class="modal">
		<div class="modal-content">
			<h4 class="center blue-text text-darken-4">Create New Event</h4>
			<div class="row center"> Event Title:
				<div class="input-field inline">
					<input id="title" type="text">
				</div>
			</div>
			<div class="row center"> Event Leader:
				<div class="input-field inline">
					<input id="leader" type="text">
					<label for="leader">Firstname Lastname</label>
				</div>
			</div>
			<div class="row center"> Date:
				<div class="input-field inline">
					<input id="date" type="text" class="datepicker">
				</div>
			</div>
			<div class="row center"> Time:
				<div class="input-field inline">
					<input id="time" type="text">
				</div>
			</div>
			<div class="row center"> Location:
				<div class="input-field inline">
					<input id="location" type="text">
				</div>
			</div>
			<div class="row center"> Max People:
				<div class="input-field inline">
					<input id="maxpeople" type="number" min="1">
					<label for="maxpeople">Leave blank if no max</label>
				</div>
			</div>
			<div class="row center">
				<div class="switch">
					<label>
						Off
						<input type="checkbox" id="additionalStepEnabled">
						<span class="lever"></span>
						On
					</label>
					<span style="margin-left: 10px;">Require additional step before registration</span>
				</div>
			</div>
			<div id="additionalStepFields" class="hide">
				<div class="row center"> Additional Step Description:
					<div class="input-field inline" style="width: 100%;">
						<div id="additionalStepDescription-editor" style="min-height: 200px; background: white;"></div>
					</div>
				</div>
				<div class="row center">
					<h6>Additional Step Links:</h6>
					<div id="additionalStepLinksContainer" style="width: 100%; margin-top: 10px;">
						<!-- Links will be added here dynamically -->
					</div>
					<div class="row center" style="margin-top: 10px;">
						<a href="javascript: addAdditionalStepLink()" class="waves-effect waves-light btn-small blue darken-4">
							<i class="material-icons left">add</i>Add Link
						</a>
					</div>
				</div>
			</div>
			<div class="row center"> Overall Event Description:
				<div class="input-field inline" style="width: 100%;">
					<div id="description-editor" style="min-height: 200px; background: white;"></div>
				</div>
			</div>
		</div>
		<div class="modal-footer">
			<div class="row center"><a href="javascript: createNewEvent()"
					class="modal-close waves-effect waves-blue btn-flat btn-large blue darken-4 white-text">Create</a>
			</div>
			<!-- Removed cancel button to make modal cleaner, you can exit by clicking outside the modal anyway -->
			<!--		<div class="row center"><a href="#!" class="modal-close waves-effect waves-blue btn-flat btn-large red accent-4 white-text">Cancel</a></div>-->
		</div>
	</div>

	<!-- Preloader and it's background. -->
	<div class="preloader-background">
		<div class="preloader-wrapper big active">
			<div class="spinner-layer spinner-blue">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-red">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-yellow">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-green">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
		</div>
		<p>Loading</p>
	</div>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

	<!-- The core Firebase JS SDK is always required and must be listed first -->
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-app.js"></script>

	<!-- TODO: Add SDKs for Firebase products that you want to use
     https://firebase.google.com/docs/web/setup#available-libraries -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-analytics.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-auth.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-firestore.js"></script>
	<script type="text/javascript" src="/js/firebaseStuff.js"></script>
	<script type="text/javascript" src="/js/materialize.min.js"></script>
	<script type="text/javascript" src="/js/preloader.js"></script>	<script type="text/javascript" src="/js/navbar-component.js"></script>
	<script type="text/javascript" src="/js/navbar.js"></script>
	<script type="text/javascript" src="/admin/checkPermission.js"></script>
	<!-- Quill Editor -->
	<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
	<script type="text/javascript" src="/admin/project/project.js"></script>
</body>

</html>
