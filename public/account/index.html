<!DOCTYPE html>
<html>

<head>
	<link rel="shortcut icon" href="/img/icon_nhs.png">
	<!--Import Google Icon Font-->
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<!--Import materialize.css-->
	<link type="text/css" rel="stylesheet" href="/css/materialize.min.css" media="screen,projection" />
	<link type="text/css" rel="stylesheet" href="/css/style.css" media="screen,projection" />

	<!--Let browser know website is optimized for mobile-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta charset="utf-8">
	<title>HHS NHS | Account</title>
</head>

<body>
	<!-- Navbar Component Container -->
	<div id="navbar-container"></div>
	<div class="container">
		<section class="account-section">
			<h4 class="center-align blue-text text-darken-4">Profile</h4>
			<p class="center-align grey-text">Update your name, grade, and ID number.</p>
			<div class="name-edit center-align blue-text text-darken-4" style="padding: 0.5rem 0 1rem; font-weight:bold">
				<div class="row" style="margin-top:0.5 rem;">
					<div class="input-field col s12 m6" style="margin-bottom:0;">
						<input id="firstName" type="text">
						<label for="firstName">First name</label>
					</div>
					<div class="input-field col s12 m6" style="margin-bottom:0;">
						<input id="lastName" type="text">
						<label for="lastName">Last name</label>
					</div>
				</div>

				<div class="row" style="margin-top:0.5rem;">
					<p class="col s12 m2">Grade:</p>
					<p class="col s12 m3">
						<label>
							<input class="with-gap" name="gradeAccount" type="radio" value="10" />
							<span>10</span>
						</label>
					</p>
					<p class="col s12 m3">
						<label>
							<input class="with-gap" name="gradeAccount" type="radio" value="11" />
							<span>11</span>
						</label>
					</p>
					<p class="col s12 m3">
						<label>
							<input class="with-gap" name="gradeAccount" type="radio" value="12" />
							<span>12</span>
						</label>
					</p>
				</div>

				<div class="row" style="margin-top:0.5rem;">
					<div class="input-field col s12 m6 offset-m3" style="margin-bottom:0;">
						<input id="idNumber" type="number" min="0" max="9999999" step="1">
						<label for="idNumber">ID Number</label>
					</div>
				</div>
				<!-- <div class="row" style="margin-top:0.5rem;">
					<div class="col s12">
						<a id="saveNameBtn" class="btn blue darken-4">Save name</a>
					</div>
				</div> -->
			</div>
		</section>

		<div class="divider"></div>

		<section class="account-section">
			<h4 class="center-align blue-text text-darken-4">Hours</h4>
			<p class="center-align grey-text">Click a card to view updates since the last hours reset.</p>
			<div class="row">
				<div class="col s12 m6 l4">
					<div class="panel panel--hours card lighten-5 hour-card" data-hour-field="regularHours" data-hour-label="Regular Hours" role="button" tabindex="0" title="View regular hour updates">
						<div class="panel-content--hours card-content black-text">
							<h4 class="center-align">Regular Hours</h4>
							<h1 id="regularhours" class="center-align"></h1>
							<h5 id="regularReq" class="center-align">Required: </h5>
						</div>
					</div>
				</div>
				<div class="col s12 m6 l4">
					<div class="panel panel--hours card lighten-5 hour-card" data-hour-field="projectHours" data-hour-label="Project Hours" role="button" tabindex="0" title="View project hour updates">
						<div class="panel-content--hours card-content black-text">
							<h4 class="center-align">Project Hours</h4>
							<h1 id="projecthours" class="center-align"></h1>
							<h5 id="projectReq" class="center-align">Required: </h5>
						</div>
					</div>
				</div>
				<div class="col s12 m6 l4">
					<div class="panel panel--hours card lighten-5 hour-card" data-hour-field="socialHours" data-hour-label="Social Hours" role="button" tabindex="0" title="View social hour updates">
						<div class="panel-content--hours card-content black-text">
							<h4 class="center-align">Social Hours</h4>
							<h1 id="socialhours" class="center-align"></h1>
							<h5 id="socialReq" class="center-align">Required: </h5>
						</div>
					</div>
				</div>
			</div>
		</section>

		<div id="hourLogsSection" class="hide">
			<div class="divider"></div>
			<section class="account-section">
				<h4 id="hourHistoryTitle" class="center-align blue-text text-darken-4">Hour Logs</h4>
				<p id="hourHistorySubtitle" class="center-align grey-text"></p>
				<ul id="hourHistoryList" class="collection"></ul>
			</section>
		</div>
		<!-- <h5 id="hoursReqs" class="center-align"></h5> -->
	</div>
		

	<!-- Preloader and it's background. -->
	<div class="preloader-background">
		<div class="preloader-wrapper big active">
			<div class="spinner-layer spinner-blue">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-red">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-yellow">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-green">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
		</div>
		<p>Loading</p>
	</div>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

	<!-- The core Firebase JS SDK is always required and must be listed first -->
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-app.js"></script>

	<!-- TODO: Add SDKs for Firebase products that you want to use
     https://firebase.google.com/docs/web/setup#available-libraries -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-analytics.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-auth.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-firestore.js"></script>
	<script type="text/javascript" src="/js/firebaseStuff.js"></script>
	<script type="text/javascript" src="/js/materialize.min.js"></script>
	<script type="text/javascript" src="/js/preloader.js"></script>
	<script type="text/javascript" src="/js/navbar-component.js"></script>
	<script type="text/javascript" src="/js/navbar.js"></script>
	<script type="text/javascript" src="/account/account.js"></script>
</body>

</html>
