<!DOCTYPE html>
<html>

<head>
	<link rel="shortcut icon" href="/img/icon_nhs.png">
	<!--Import Google Icon Font-->
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<!--Import materialize.css-->
	<link type="text/css" rel="stylesheet" href="/css/materialize.min.css" media="screen,projection" />
	<link type="text/css" rel="stylesheet" href="/css/style.css" media="screen,projection" />
	<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

	<!--Let browser know website is optimized for mobile-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta charset="utf-8">
	<title>HHS NHS | Project</title>
</head>

<body>
	<div class="parallax-container">
		<!-- Navbar Component Container -->
		<div id="navbar-container"></div>
		<div class="parallax"> <img src="/img/project2022/Tree.jpg" alt="Project hero"> </div>
		<h1 class="white-text center"><b id="project-landing-title">Project Gloves</b></h1>
		<br>
	</div>
	<div class="section white">
		<div class="row container">
			<div id="project-landing-description" class="project-landing-description event-description center">NHS members support local organisations such as farms and gardens, learning essential skills like plant and animal care while serving as essential volunteers!</div>
		</div>
	</div>

	<!-- Project/exec-only: customize landing page -->
	<div id="project-customize-bar" class="project-customize-bar hide">
		<button type="button" id="project-hero-change-btn" class="bg-change-btn" title="Change hero image" aria-label="Change hero image">
			<i class="material-icons">image</i>
		</button>
		<button type="button" id="project-customize-btn" class="bg-change-btn" title="Edit title and description" aria-label="Edit title and description">
			<i class="material-icons">edit</i>
		</button>
	</div>
	<input type="file" id="project-hero-change-input" accept="image/*" hidden>

	<div id="project-customize-modal" class="modal">
		<div class="modal-content">
			<h4>Customize Project Page</h4>
			<div class="input-field">
				<input id="project-customize-title" type="text" maxlength="80">
				<label for="project-customize-title">Title</label>
			</div>
			<label class="project-customize-editor-label">Description</label>
			<div id="project-description-editor"></div>
		</div>
		<div class="modal-footer">
			<a href="#!" class="modal-close waves-effect btn-flat">Cancel</a>
			<button type="button" id="project-customize-save" class="waves-effect waves-light btn blue darken-4">Save changes</button>
		</div>
	</div>

	<!-- Preloader and it's background. -->
	<div class="preloader-background">
		<div class="preloader-wrapper big active">
			<div class="spinner-layer spinner-blue">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-red">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-yellow">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
			<div class="spinner-layer spinner-green">
				<div class="circle-clipper left">
					<div class="circle"></div>
				</div>
				<div class="gap-patch">
					<div class="circle"></div>
				</div>
				<div class="circle-clipper right">
					<div class="circle"></div>
				</div>
			</div>
		</div>
		<p>Loading</p>
	</div>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

	<!-- The core Firebase JS SDK is always required and must be listed first -->
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-app.js"></script>

	<!-- TODO: Add SDKs for Firebase products that you want to use
     https://firebase.google.com/docs/web/setup#available-libraries -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-analytics.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-auth.js"></script>
	<script src="https://www.gstatic.com/firebasejs/7.0.0/firebase-firestore.js"></script>
	<script type="text/javascript" src="/js/firebaseStuff.js"></script>
	<script type="text/javascript" src="/js/materialize.min.js"></script>
	<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
	<script type="text/javascript" src="/js/preloader.js"></script>
	<script type="text/javascript" src="/js/navbar-component.js"></script>
	<script type="text/javascript" src="/js/navbar.js"></script>
	<script type="text/javascript" src="/project/project.js"></script>
	<script type="text/javascript" src="/project/project-customize.js"></script>
</body>

</html>
